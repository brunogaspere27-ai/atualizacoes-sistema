name: CW Transportadora CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint e Formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências de desenvolvimento
        run: pip install -r requirements-dev.txt

      - name: Verificar formatação com Ruff
        run: ruff check .

      - name: Verificar imports com isort
        run: isort --check-only .

  test:
    name: Testes Automatizados
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências de produção
        run: pip install -r requirements.txt

      - name: Instalar dependências de desenvolvimento
        run: pip install -r requirements-dev.txt

      - name: Executar testes unitários com pytest
        env:
          SUPABASE_URL: ""
        run: pytest testes/ -v --tb=short --no-header -m "not integration"

  build-check:
    name: Verificação de Build
    runs-on: windows-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar se aplicação inicia sem erros de importação
        run: python -c "from config.settings import settings; print('Settings OK'); from utils.database import criar_banco; print('Database OK'); from services.sync_service import sync_service; print('Sync OK')"
